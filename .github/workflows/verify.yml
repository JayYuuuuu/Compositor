name: Verify

on:
  workflow_dispatch:
    inputs:
      run_ui:
        description: Run the bilingual localization UI workflow
        type: boolean
        default: true
  push:
  pull_request:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: unit
    # Push covers same-repo branches. pull_request runs only for forks, so a PR is not tested twice.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Resolve Swift packages
        run: >
          xcodebuild -resolvePackageDependencies
          -project Compositor.xcodeproj
          -scheme Compositor
          -onlyUsePackageVersionsFromResolvedFile

      - name: Build for testing
        id: build
        run: >
          xcodebuild build-for-testing
          -project Compositor.xcodeproj
          -scheme Compositor
          -destination 'platform=macOS,arch=arm64'
          -configuration Debug
          -derivedDataPath DerivedData
          CODE_SIGN_IDENTITY=-

      # These two suites show real windows and time them, so they run alone after the rest.
      - name: Run unit tests in parallel
        run: >
          xcodebuild test-without-building
          -testLanguage en -testRegion US
          -project Compositor.xcodeproj
          -scheme Compositor
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath DerivedData
          -resultBundlePath ParallelResults.xcresult
          -parallel-testing-enabled YES
          -skip-testing:CompositorTests/FloatingPanelTests
          -skip-testing:CompositorTests/SliderSnapTests

      - name: Run window tests serially
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >
          xcodebuild test-without-building
          -testLanguage en -testRegion US
          -project Compositor.xcodeproj
          -scheme Compositor
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath DerivedData
          -resultBundlePath SerialResults.xcresult
          -parallel-testing-enabled NO
          -only-testing:CompositorTests/FloatingPanelTests
          -only-testing:CompositorTests/SliderSnapTests

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: '*.xcresult'
          retention-days: 7
          if-no-files-found: ignore

  release-launch:
    name: release-launch
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Build the distributed Release configuration
        run: >
          xcodebuild build
          -project Compositor.xcodeproj
          -scheme Compositor
          -destination 'platform=macOS,arch=arm64'
          -configuration Release
          -derivedDataPath ReleaseDerivedData
          CODE_SIGN_IDENTITY=-
          CODE_SIGN_STYLE=Manual
          DEVELOPMENT_TEAM=
          ARCHS=arm64
          ONLY_ACTIVE_ARCH=YES

      - name: Verify Release signature and actual startup
        run: |
          codesign --verify --deep --strict "ReleaseDerivedData/Build/Products/Release/Compositor CN.app"
          python3 scripts/verify-release-launch.py --app "ReleaseDerivedData/Build/Products/Release/Compositor CN.app" --output release-launch.json

      - name: Upload Release launch receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-launch-receipt
          path: release-launch.json
          retention-days: 7
          if-no-files-found: ignore

  localization-ui:
    name: localization-ui
    if: github.event_name == 'workflow_dispatch' && inputs.run_ui
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Test bilingual localization workflow
        run: >
          xcodebuild test
          -project Compositor.xcodeproj
          -scheme CompositorLocalization
          -destination 'platform=macOS,arch=arm64'
          -configuration Debug
          -derivedDataPath DerivedData
          -resultBundlePath LocalizationUIResults.xcresult
          -parallel-testing-enabled NO
          -only-testing:CompositorUITests/LocalizationUITests
          CODE_SIGN_IDENTITY=-

      - name: Upload localization UI results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: localization-ui-results
          path: LocalizationUIResults.xcresult
          retention-days: 7
          if-no-files-found: ignore
